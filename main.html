<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
<style>
        body {
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
            font-size: 18px;
        }

        .middle {
            width: 90%;
            margin: 20px auto;
            border-collapse: separate;
            border-spacing: 1px;
            border: 1px solid black;
        }

        .middle td {
            border: 1px solid black;
            padding: 1px;
        }

        .center {
            text-align: center;
        }

        .right {
            text-align: right;
        }

        .green {
            background-color: green;
        }

        .blue {
            background-color: blue;
        }

        #table-1 {
            width: 90%;
        }

        #table-2 {
            height: 100px;
        }

        #table-3 {
            height: 165px;
        }

        #t-image {
            text-align: center;
        }

        #t-image img {
            width: 185px;
            height: 130px;
        }
    </style>
</head>

<body>

    <h1>HTML Assignment #3</h1>

    <!-- Table 1 -->
    <table id="table-1" class="middle">
        <tr>
            <td id="t11">left</td>
            <td id="t12" class="center">center</td>
            <td id="t13" class="right">right</td>
        </tr>

        <tr>
            <td>left</td>
            <td class="center">center</td>
            <td class="right">right</td>
        </tr>

        <tr>
            <td>left</td>
            <td class="center">center</td>
            <td class="right">right</td>
        </tr>
    </table>


    <!-- Table 2 -->
    <table id="table-2" class="middle">
        <tr>
            <td id="t21" colspan="6"></td>
        </tr>

        <tr>
            <td rowspan="4"></td>
            <td></td>
            <td colspan="3"></td>
            <td></td>
        </tr>

        <tr>
            <td></td>
            <td colspan="3" rowspan="2"></td>
            <td></td>
        </tr>

        <tr>
            <td></td>
            <td></td>
        </tr>

        <tr>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
        </tr>

        <tr>
            <td colspan="6"></td>
        </tr>
    </table>


    <!-- Table 3 -->
    <table id="table-3" class="middle">
        <tr>
            <td colspan="6" class="green">&nbsp;</td>
        </tr>

        <tr>
            <td colspan="2">&nbsp;</td>

            <td id="t-image" colspan="2">
                <img
                    src="https://www2.d125.org/applied_arts/teched/courses/WEB/portfolios/2013_FallP3/Luthra%20Portfolio/images-1.jpeg"
                    alt="Basketball player">
            </td>

            <td colspan="2">&nbsp;</td>
        </tr>

        <tr>
            <td colspan="6" class="blue">&nbsp;</td>
        </tr>
    </table>
</body>

</html>
